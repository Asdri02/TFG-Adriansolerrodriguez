[pytest]
# pythonpath = src hace que `from web.app import app`, `import reference_db`,
# etc. resuelvan sin tener que exportar PYTHONPATH=src a mano.
pythonpath = src
testpaths = tests
addopts = -q
filterwarnings =
    # utcnow() está deprecado en stdlib; lo silenciamos en CI hasta migrarlo a
    # datetime.now(UTC) en calibration_db/templates_db (ver hallazgos del review).
    ignore::DeprecationWarning
